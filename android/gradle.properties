# JVM 参数：Chaquopy 构建期要在 JVM 里跑 pip/字节码编译任务，堆给足。
# 注意：此处刻意【不】设 -Dfile.encoding=UTF-8。原因（2026-11-19 定位）：
# daemon 用它写 test worker 的 classpath argfile（UTF-8），而 JDK17 java.exe
# 按系统本地编码（本机 GBK）解码 argfile → 工作区中文路径条目全部乱码，
# 所有单元测试类 ClassNotFoundException。源码/资源编码由 AGP/kotlinc 显式
# 指定 UTF-8，不依赖 file.encoding，故移除后无副作用。
org.gradle.jvmargs=-Xmx3072m

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# 构建加速
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin 官方代码风格
kotlin.code.style=official

# 如需通过代理拉取依赖，请在本机 ~/.gradle/gradle.properties 中自行配置，例如：
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
